name: Deploy to Raspberry Pi

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    # Deploys only run where the DEPLOY_TARGETS repository variable is set (forks leave it unset),
    # and only if the build workflow succeeded.
    if: ${{ vars.DEPLOY_TARGETS != '' && (github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch') }}
    env:
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      TAILNET_DOMAIN: ${{ vars.TAILNET_DOMAIN }}
      DEPLOY_TZ: ${{ vars.DEPLOY_TZ }}
    strategy:
      fail-fast: false
      matrix:
        # DEPLOY_TARGETS is a JSON array of {runner, host, airplay_name}. The fallback keeps matrix
        # expansion valid when the variable is unset; the job-level if then skips the job.
        include: ${{ fromJSON(vars.DEPLOY_TARGETS || '[{}]') }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Log in to GitHub Container Registry
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GHCR_USER: ${{ github.actor }}
      run: |
        echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

    - name: Choose docker compose command
      run: |
        # Prefer the v2 plugin; fall back to the standalone v1 binary on older runners.
        if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
        echo "DC=$DC -f docker-compose.yml -f docker-compose.https.yml" >> "$GITHUB_ENV"

    - name: Renew Tailscale certificate
      run: |
        cd ~/cert
        HOSTNAME=$(hostname)
        sudo tailscale cert "${HOSTNAME}.${TAILNET_DOMAIN}"
        sudo openssl pkcs12 -export -out certificate.pfx -inkey "${HOSTNAME}.${TAILNET_DOMAIN}.key" -in "${HOSTNAME}.${TAILNET_DOMAIN}.crt" -passout pass:
        sudo chown "${DEPLOY_USER}". certificate.pfx
        # The PFX holds the unencrypted private key; only the deploy user (uid 1000, same as the container's user) reads it.
        sudo chmod 600 certificate.pfx "${HOSTNAME}.${TAILNET_DOMAIN}.key"

    - name: Write deployment variables to .env file
      env:
        AIRPLAY_NAME: "${{ matrix.airplay_name }}"
      run: |
        cat > .env << EOF
        AIRPLAY_NAME=${AIRPLAY_NAME}
        HOMESPEAKER_IMAGE=ghcr.io/${{ github.repository_owner }}/homespeaker:latest
        HOMESPEAKER_ENV_FILE=/home/${DEPLOY_USER}/homespeaker-secrets.env
        MUSIC_DIR=/home/${DEPLOY_USER}/music
        CERT_DIR=/home/${DEPLOY_USER}/cert
        TZ=${DEPLOY_TZ}
        COMPOSE_PROFILES=airplay
        PUID=1000
        EOF

    - name: Ensure secrets file exists
      run: touch "/home/${DEPLOY_USER}/homespeaker-secrets.env"

    - name: Pull latest images
      env:
        COMPOSE_HTTP_TIMEOUT: 200
      run: |
        # shellcheck disable=SC2086
        # Registry pulls from docker.io/public.ecr.aws are flaky from the Pis;
        # retry, and as a last resort tolerate sidecar pull failures - those
        # images are already cached locally, and the app image comes from ghcr.
        for attempt in 1 2 3; do
          echo "Pull attempt $attempt/3..."
          $DC pull && exit 0
          [ $attempt -lt 3 ] && echo "Retrying in 10s..." && sleep 10
        done
        echo "Full pull failed; tolerating failed sidecar pulls..."
        $DC pull --ignore-pull-failures

    - name: Stop containers
      env:
        COMPOSE_HTTP_TIMEOUT: 200
      run: |
        # shellcheck disable=SC2086
        for attempt in 1 2 3; do
          echo "Stop attempt $attempt/3..."
          $DC down --timeout 120 --remove-orphans && break
          [ $attempt -lt 3 ] && echo "Retrying in 10s..." && sleep 10
        done

    - name: Start containers (no build!)
      env:
        COMPOSE_HTTP_TIMEOUT: 200
      run: |
        # shellcheck disable=SC2086
        for attempt in 1 2 3; do
          echo "Start attempt $attempt/3..."
          $DC up -d --remove-orphans && break
          [ $attempt -lt 3 ] && echo "Retrying in 10s..." && sleep 10
        done

    - name: Wait for services to be ready
      run: |
        echo "Waiting for HomeSpeaker service to respond..."
        for i in $(seq 1 12); do
          if curl -sk https://localhost/ > /dev/null 2>&1; then
            echo "✓ Service is up and responding"
            break
          fi
          echo "  Attempt $i/12 - waiting 5s..."
          sleep 5
        done
        # First HTTP response doesn't mean the Blazor circuit endpoint is warm;
        # refreshing the kiosk too early loads prerendered HTML whose circuit
        # never connects, leaving a frozen page. Give Kestrel a moment to settle.
        sleep 10

    - name: Refresh browser on touchscreen
      run: |
        echo "Attempting to refresh browser on :0 display..."
        
        # Strategy 1: Try Chromium remote debugging protocol (most reliable)
        if curl -s http://localhost:9222/json/version > /dev/null 2>&1; then
          echo "✓ Chrome debugging port available, using Page.reload..."
          PAGE_ID=$(curl -s http://localhost:9222/json/list | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -n "$PAGE_ID" ]; then
            curl -s "http://localhost:9222/json/activate/$PAGE_ID" > /dev/null
            curl -s "http://localhost:9222/json/new?javascript:location.reload()" > /dev/null
            echo "✓ Browser refreshed via remote debugging protocol"
            exit 0
          fi
        fi
        
        # Strategy 2: xdotool - but activate the Chromium window first. A bare
        # `xdotool key F5` goes to whichever window has focus, which on the
        # kiosk is often NOT Chromium, so the refresh silently did nothing
        # while reporting success.
        if command -v xdotool > /dev/null 2>&1; then
          echo "Trying xdotool with XAUTHORITY..."
          export DISPLAY=:0

          # Find the X authority file
          XAUTH=$(find "/home/${DEPLOY_USER}" -name '.Xauthority' 2>/dev/null | head -1)
          if [ -z "$XAUTH" ]; then
            XAUTH=$(find /run/user -name 'Xauthority' 2>/dev/null | head -1)
          fi
          [ -z "$XAUTH" ] && XAUTH="/home/${DEPLOY_USER}/.Xauthority"
          export XAUTHORITY=$XAUTH
          echo "  Using XAUTHORITY=$XAUTH"

          WID=$(xdotool search --onlyvisible --class chromium 2>/dev/null | head -1)
          [ -z "$WID" ] && WID=$(xdotool search --onlyvisible --class chrome 2>/dev/null | head -1)

          if [ -n "$WID" ]; then
            xdotool windowactivate --sync "$WID"
            sleep 1
            if xdotool key --clearmodifiers F5 2>&1; then
              echo "✓ Browser refreshed via xdotool (window $WID activated)"
              exit 0
            fi
          else
            echo "  Warning: No Chromium window found; sending blind F5"
            if xdotool key F5 2>&1; then
              echo "✓ F5 sent (no window targeting)"
              exit 0
            fi
          fi
        fi

        echo "⚠ All refresh strategies failed - browser may need manual refresh (F5)"
        exit 1

    - name: Clean up old images
      run: docker image prune -af --filter "until=168h"
      continue-on-error: true

    - name: Log out of GitHub Container Registry
      if: always()
      run: docker logout ghcr.io
