name: Clean up removed lgtm telemetry volume

# One-off: the lgtm telemetry container was dropped from docker-compose.yml,
# but `docker-compose down --remove-orphans` doesn't delete named volumes, so
# the lgtm-data volume (Grafana/Loki/Tempo/Prometheus data) is left behind
# taking up SD card space. Run manually once per Pi, then delete this
# workflow file.
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    strategy:
      matrix:
        runner: [kitchen, upstairs]

    steps:
    - name: Remove leftover lgtm container and volume
      run: |
        docker rm -f lgtm 2>/dev/null || true
        echo "Volumes matching 'lgtm' before cleanup:"
        docker volume ls --filter name=lgtm
        docker volume ls -q --filter name=lgtm | xargs -r docker volume rm
        echo "Volumes matching 'lgtm' after cleanup:"
        docker volume ls --filter name=lgtm
