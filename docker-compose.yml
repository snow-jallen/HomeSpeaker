version: '3.4'
services:
  homespeaker.server2:
    container_name: homespeaker
    # Use pre-built image from GitHub Container Registry
    # Falls back to local build if image not available
    image: ${HOMESPEAKER_IMAGE:-ghcr.io/snow-jallen/homespeaker:latest}
    build:
      context: .
      dockerfile: HomeSpeaker.Server2/Dockerfile
    restart: unless-stopped
    # Run an init (tini) as PID 1 so orphaned child processes (e.g. timed-out
    # healthcheck curls) are reaped instead of accumulating against dotnet.
    init: true
    devices:
    - /dev/snd:/dev/snd
    ports:
    - 80:80
    - 443:443
    volumes:
    - "/home/piuser/music:/music"
    - "/home/piuser/cert:/certs"
    - airplay-shared:/tmp/airplay-shared  # Shared volume for AirPlay state
    - /run/user/1000/pulse:/run/user/1000/pulse:rw
    # Persistent secrets file — create this once on each Pi, never committed to git.
    # See homespeaker-secrets.env.example for the template.
    # The deploy workflow creates this file (empty) if it doesn't exist yet.
    env_file:
      - /home/piuser/homespeaker-secrets.env
    depends_on:
    - openobserve
    environment:
    - TZ=America/Denver
    - MediaFolder=/music
    # ALSA_CARD is now auto-detected. Uncomment to override:
    # - ALSA_CARD=Headphones
    - SqliteConnectionString=Data Source=/music/HomeSpeaker.db
    - ASPNETCORE_URLS=https://+443;http://+:80
    - ASPNETCORE_Kestrel__Certificates__Default__Path=/certs/certificate.pfx
    - FFMpegLocation=/usr/bin/ffmpeg
    # OpenObserve replaces the (memory-only) Aspire dashboard. Its OTLP/HTTP
    # ingest needs Basic auth: OTEL_EXPORTER_OTLP_HEADERS comes from the
    # secrets env file above (see homespeaker-secrets.env.example).
    - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://openobserve:5080/api/default
    - OTEL_SERVICE_NAME=HomeSpeaker
    - PULSE_SERVER=unix:/run/user/1000/pulse/native
    networks:
      speakernet:

  # Persistent logs/traces/metrics for HomeSpeaker AND Metanoeo (whose stack
  # reaches it via the published host port 5080). Root credentials live in the
  # secrets env file: ZO_ROOT_USER_EMAIL / ZO_ROOT_USER_PASSWORD.
  openobserve:
    container_name: openobserve
    image: public.ecr.aws/zinclabs/openobserve:latest
    restart: unless-stopped
    environment:
    - ZO_DATA_DIR=/data
    env_file:
      - /home/piuser/homespeaker-secrets.env
    volumes:
      - openobserve-data:/data
    ports:
    - 5080:5080 # web UI + OTLP/HTTP ingest
    networks:
      speakernet:

  airplay-receiver:
    image: mikebrady/shairport-sync:latest
    container_name: homespeaker-airplay
    restart: unless-stopped
    network_mode: host
    volumes:
      - airplay-shared:/tmp/airplay-shared  # Shared volume for state files
      - /run/user/1000/pulse:/run/user/1000/pulse:rw  # PulseAudio socket
      - ./scripts:/scripts:ro  # Startup scripts (including ALSA device detection)
    devices:
      - /dev/snd:/dev/snd  # Add direct ALSA device access
    environment:
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      - PULSE_RUNTIME_PATH=/run/user/1000/pulse
      - AIRPLAY_NAME=${AIRPLAY_NAME:-HomeSpeaker}
      # ALSA_CARD is auto-detected by start-shairport.sh. Uncomment to override:
      # - ALSA_CARD=Headphones
    command: ["/bin/sh", "/scripts/start-shairport.sh"]
    depends_on:
      - homespeaker.server2

networks:
 speakernet:

volumes:
  airplay-shared:
  openobserve-data:
