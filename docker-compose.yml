services:
  homespeaker.server2:
    container_name: homespeaker
    # Use pre-built image from GitHub Container Registry
    # Falls back to local build if image not available
    image: ${HOMESPEAKER_IMAGE:-ghcr.io/snow-jallen/homespeaker:latest}
    build:
      context: .
      dockerfile: HomeSpeaker.Server2/Dockerfile
    restart: unless-stopped
    # Run an init (tini) as PID 1 so orphaned child processes (e.g. timed-out
    # healthcheck curls) are reaped instead of accumulating against dotnet.
    init: true
    devices:
    - /dev/snd:/dev/snd
    ports:
    - "${HTTP_PORT:-80}:80"
    volumes:
    - "${MUSIC_DIR:-./music}:/music"
    - airplay-shared:/tmp/airplay-shared  # Shared volume for AirPlay state
    - /run/user/${PUID:-1000}/pulse:/run/user/${PUID:-1000}/pulse:rw
    # Optional settings/secrets file (copy homespeaker.env.example to homespeaker.env).
    # The file may be absent (Compose 2.24 or newer).
    env_file:
    - path: ./homespeaker.env
      required: false
    environment:
    - TZ=${TZ:-Etc/UTC}
    - MediaFolder=/music
    # ALSA_CARD is now auto-detected. Uncomment to override:
    # - ALSA_CARD=Headphones
    - SqliteConnectionString=Data Source=/music/HomeSpeaker.db
    - ASPNETCORE_URLS=http://+:80
    - FFMpegLocation=/usr/bin/ffmpeg
    - PULSE_SERVER=unix:/run/user/${PUID:-1000}/pulse/native
    - OTEL_EXPORTER_OTLP_ENDPOINT
    networks:
      speakernet:

  airplay-receiver:
    profiles: [airplay]
    image: mikebrady/shairport-sync:latest
    container_name: homespeaker-airplay
    restart: unless-stopped
    network_mode: host
    volumes:
      - airplay-shared:/tmp/airplay-shared  # Shared volume for state files
      - /run/user/${PUID:-1000}/pulse:/run/user/${PUID:-1000}/pulse:rw  # PulseAudio socket
      - ./scripts:/scripts:ro  # Startup scripts (including ALSA device detection)
    devices:
      - /dev/snd:/dev/snd  # Add direct ALSA device access
    environment:
      - PULSE_SERVER=unix:/run/user/${PUID:-1000}/pulse/native
      - PULSE_RUNTIME_PATH=/run/user/${PUID:-1000}/pulse
      - AIRPLAY_NAME=${AIRPLAY_NAME:-HomeSpeaker}
      # ALSA_CARD is auto-detected by start-shairport.sh. Uncomment to override:
      # - ALSA_CARD=Headphones
    command: ["/bin/sh", "/scripts/start-shairport.sh"]
    depends_on:
      - homespeaker.server2

  aspire-dashboard:
    profiles: [telemetry]
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: homespeaker-aspire
    restart: unless-stopped
    ports:
    - "18888:18888"
    environment:
    - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    networks:
      speakernet:

networks:
 speakernet:

volumes:
  airplay-shared:
